# Sends a release to Nexus's update server (api.gxthgirls.tech/nexus) when you click Publish on it.
#
# No secrets: the job signs in with a short-lived GitHub OIDC token, which the server accepts only from
# this repository, this workflow and a release event. The server checks the installer's signature
# against the updater key, stores it on downloads.gxthgirls.tech and points latest.json at it.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Download installer and signature
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "Nexus_${TAG#v}_x64-setup.exe" -p "Nexus_${TAG#v}_x64-setup.exe.sig"

      - name: Upload to the update server
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          API: https://api.gxthgirls.tech/nexus
        run: |
          version=${TAG#v}
          exe="Nexus_${version}_x64-setup.exe"
          # Update toast text: the first bullet of the release notes, without Markdown.
          notes=$(printf '%s\n' "$BODY" | grep -m1 -E '^\s*[-*] ' | sed -E 's/^\s*[-*] +//; s/\*\*|__|`//g' | cut -c1-300)
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$API" | jq -r .value)
          curl -sS --fail-with-body -X PUT "$API/releases/$version" \
            -H "Authorization: Bearer $token" \
            -H "X-Signature: $(cat "$exe.sig")" \
            -H "X-Notes: $(jq -rn --arg s "$notes" '$s|@uri')" \
            --data-binary "@$exe"
          echo
          curl -sSf "$API/releases/latest"
